name: Generate Snake Animation

on:
  # Jalankan otomatis setiap hari jam 12 siang UTC
  schedule:
    - cron: "0 12 * * *"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # Jalankan setiap kali ada push ke branch main
  push:
    branches:
      - main

# Wajib: izinkan Actions untuk push ke repository
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Diganti ke peaceiris/actions-gh-pages@v4 (support Node.js 20+)
      - name: Push Output to `output` Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
